<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QuickSort Benchmark</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .chart-wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        canvas {
            background: white;
            border: 1px solid #eee;
        }

        .legend {
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <h1>QuickSort Benchmark</h1>
    <p>Comparing recursive QuickSort, iterative QuickSort, and JavaScript's built-in <code>Array.prototype.sort</code>.
        Data generated by <code>src/benchmark.js</code>.</p>

    <div class="chart-wrap">
        <canvas id="benchChart" width="900" height="450"></canvas>
    </div>

    <div id="meta"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="benchmark.js"></script>
</body>

</html>
